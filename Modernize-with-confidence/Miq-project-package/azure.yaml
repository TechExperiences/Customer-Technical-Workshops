name: caldova-order-management
metadata:
  template: caldova-order-management@0.0.1

# The preprovision hook owns the deployment because ARM/Bicep cannot itself catch
# a regional failure and retry another location. The marker module gives azd a
# valid resource-bearing provision phase without creating another resource group.
infra:
  provider: bicep
  path: infra
  module: azd-noop

hooks:
  preprovision:
    windows:
      shell: pwsh
      run: ./scripts/azd-provision.ps1
  postprovision:
    windows:
      shell: pwsh
      run: ./scripts/azd-postprovision.ps1
